[package]
name = "copilotstudio-client"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "Unofficial Rust port of Microsoft's Copilot Studio client (Direct-to-Engine protocol) from the Microsoft 365 Agents SDK"
repository = "https://github.com/niteosec/copilotstudio-rs"
homepage = "https://github.com/niteosec/copilotstudio-rs"
documentation = "https://docs.rs/copilotstudio-client"
readme = "README.md"
keywords = ["copilot-studio", "microsoft", "agents", "power-platform", "bot-framework"]
categories = ["api-bindings", "web-programming::http-client", "asynchronous"]
include = ["src/**", "Cargo.toml", "README.md", "CHANGELOG.md", "LICENSE-*", "NOTICE", "UPSTREAM.toml", "docs/DESIGN.md"]

[dependencies]
async-stream = "0.3"
bytes = "1"
futures-core = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
http = "1"
reqwest = { version = "0.13", features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
url = "2"

[dev-dependencies]
futures = "0.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "io-util", "time"] }
tracing-subscriber = "0.3"
wiremock = "0.6"

[[example]]
name = "console"

[[example]]
name = "token"

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
